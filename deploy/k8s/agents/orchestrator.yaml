apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: a2a
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          # GHCR (CI/CD): ghcr.io/rxalx/agentstack-starter/orchestrator:latest
          # Local minikube: agentstack/orchestrator:local  +  imagePullPolicy: Never
          image: ghcr.io/rxalx/agentstack-starter/orchestrator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PORT
              value: "8000"
            - name: SERVER_URL
              value: "http://orchestrator-svc:8000"
            - name: PLATFORM_URL
              value: "http://agentstack-server-svc:8333"
            - name: PLATFORM_PUBLIC_HOST
              value: "localhost:8333"
            - name: PRODUCTION_MODE
              value: "True"    # self-registration off; register once via register-agents.sh (stable svc URL)
            - name: AGENTSTACK_ADMIN_USER
              value: "admin"
            - name: AGENTSTACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentstack-agents-secret
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-svc
  namespace: a2a
spec:
  selector:
    app: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
