apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator-with-sidecar 
  namespace: a2a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator-with-sidecar
  template:
    metadata:
      labels:
        app: translator-with-sidecar
    spec:
      containers:
        - name: translator-with-sidecar
          # GHCR (CI/CD): ghcr.io/rxalx/agentstack-starter/translator:latest
          # Local minikube: agentstack/translator:local  +  imagePullPolicy: Never
          image: ghcr.io/rxalx/agentstack-starter/translator:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"   # safe now that self-registration is off; enables kubectl port-forward for demos
            - name: PORT
              value: "8000"
            - name: SERVER_URL
              value: "http://translator-with-sidecar-svc:8000"
            - name: PLATFORM_URL
              value: "http://agentstack-server-svc:8333"
            - name: PLATFORM_PUBLIC_HOST
              value: "localhost:8333"
            - name: PRODUCTION_MODE
              value: "True"    # self-registration off; register once via register-agents.sh (stable svc URL)
            - name: AGENTSTACK_ADMIN_USER
              value: "admin"
            - name: AGENTSTACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentstack-agents-secret
                  key: admin-password
            - name: TARGET_LANGUAGE
              value: "Spanish"
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
        
        # ANP Sidecar
        - name: anp-sidecar
          image: ghcr.io/rxalx/agentstack-starter/anp-sidecar:v1.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: AGENT_NAME
              value: "translator-with-sidecar"
            - name: AGENT_DESCRIPTION
              value: "Translator agent for multi-agent workflows"
            - name: AGENT_TYPE
              value: "Translator"
            - name: AGENT_SKILLS
              value: "translation, multilingual, localization"
            - name: AGENT_PORT
              value: "8001"
            - name: MAIN_AGENT_PORT
              value: "8000"
            - name: MAIN_AGENT_HOST
              value: "localhost"
            - name: REGISTRY_URL
              value: "http://anp-registry:8080"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: did-storage
              mountPath: /app/did
      volumes:
        - name: did-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: translator-with-sidecar-svc
  namespace: a2a
spec:
  selector:
    app: translator-with-sidecar
  ports:
    - name: a2a
      port: 8000
      targetPort: 8000
    - name: anp
      port: 8001
      targetPort: 8001