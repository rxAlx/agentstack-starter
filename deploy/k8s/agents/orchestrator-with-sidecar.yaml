apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-with-sidecar 
  namespace: a2a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-with-sidecar
  template:
    metadata:
      labels:
        app: orchestrator-with-sidecar
    spec:
      containers:
        - name: orchestrator-with-sidecar
          # GHCR (CI/CD): release with `git tag orchestrator-v1_v1.0.0 && git push origin orchestrator-v1_v1.0.0`
          # Local minikube test: ghcr.io/rxalx/agentstack-starter/orchestrator-v1:dev + imagePullPolicy: IfNotPresent
          image: ghcr.io/rxalx/agentstack-starter/orchestrator-v1:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"   # safe now that self-registration is off; enables kubectl port-forward for demos
            - name: PORT
              value: "8000"
            - name: SERVER_URL
              value: "http://orchestrator-with-sidecar-svc:8000"
            - name: PLATFORM_URL
              value: "http://agentstack-server-svc:8333"
            - name: PLATFORM_PUBLIC_HOST
              value: "localhost:8333"
            - name: PRODUCTION_MODE
              value: "True"    # self-registration off; register once via register-agents.sh (stable svc URL)
            - name: A2A_TRACE
              value: "1"       # log every GET/POST of the A2A flow to stdout (kubectl logs)
            - name: AGENTSTACK_ADMIN_USER
              value: "admin"
            - name: AGENTSTACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentstack-agents-secret
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
        
        # ANP Sidecar
        - name: anp-sidecar
          image: ghcr.io/rxalx/agentstack-starter/anp-sidecar:v1.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          env:
            - name: AGENT_NAME
              value: "orchestrator"
            - name: AGENT_DESCRIPTION
              value: "Multi-agent workflow orchestrator"
            - name: AGENT_TYPE
              value: "Orchestrator"
            - name: AGENT_SKILLS
              value: "workflow,coordination,planning"
            - name: AGENT_PORT
              value: "8001"
            - name: MAIN_AGENT_PORT
              value: "8080"
            - name: MAIN_AGENT_HOST
              value: "localhost"
            - name: REGISTRY_URL
              value: "http://anp-registry:8080"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: did-storage
              mountPath: /app/did
      volumes:
        - name: did-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-with-sidecar-svc
  namespace: a2a
spec:
  selector:
    app: orchestrator-with-sidecar
  ports:
    - name: a2a
      port: 8000
      targetPort: 8000
    - name: anp
      port: 8001
      targetPort: 8001