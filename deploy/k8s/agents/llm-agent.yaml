apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-agent
  namespace: a2a
  labels:
    app: llm-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-agent
  template:
    metadata:
      labels:
        app: llm-agent
    spec:
      containers:
        - name: llm-agent
          # GHCR (CI/CD): ghcr.io/rxalx/agentstack-starter/llm-agent:latest
          # Local minikube: agentstack/llm-agent:local  +  imagePullPolicy: Never
          image: ghcr.io/rxalx/agentstack-starter/llm-agent:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"   # safe now that self-registration is off; enables kubectl port-forward for demos   # uvicorn binds + self-registers at pod IP
            - name: PORT
              value: "8000"
            - name: SERVER_URL
              value: "http://llm-agent-svc:8000"   # reported in agent card URL
            - name: PLATFORM_URL
              value: "http://agentstack-server-svc:8333"
            - name: PLATFORM_PUBLIC_HOST
              value: "localhost:8333"
            - name: PRODUCTION_MODE
              value: "True"    # self-registration off; register once via register-agents.sh (stable svc URL)
            - name: AGENTSTACK_ADMIN_USER
              value: "admin"
            - name: AGENTSTACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentstack-agents-secret
                  key: admin-password
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: llm-agent-svc
  namespace: a2a
spec:
  selector:
    app: llm-agent
  ports:
    - port: 8000
      targetPort: 8000
