apiVersion: apps/v1
kind: Deployment
metadata:
  name: translator
  namespace: a2a
  labels:
    app: translator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translator
  template:
    metadata:
      labels:
        app: translator
    spec:
      containers:
        - name: translator
          # GHCR (CI/CD): ghcr.io/rxalx/agentstack-starter/translator:latest
          # Local minikube: agentstack/translator:local  +  imagePullPolicy: Never
          image: ghcr.io/rxalx/agentstack-starter/translator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: SERVER_URL
              value: "http://translator-svc:8000"
            - name: PLATFORM_URL
              value: "http://agentstack-server-svc:8333"
            - name: AGENTSTACK_ADMIN_USER
              value: "admin"
            - name: AGENTSTACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentstack-agents-secret
                  key: admin-password
            - name: TARGET_LANGUAGE
              value: "Spanish"
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: translator-svc
  namespace: a2a
spec:
  selector:
    app: translator
  ports:
    - port: 8000
      targetPort: 8000
