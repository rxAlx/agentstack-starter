apiVersion: apps/v1
kind: Deployment
metadata:
  name: anp-registry
  namespace: a2a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anp-registry
  template:
    metadata:
      labels:
        app: anp-registry
    spec:
      containers:
        - name: registry
          image: ghcr.io/rxalx/agentstack-starter/anp-registry:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: anp-registry
  namespace: a2a
spec:
  selector:
    app: anp-registry
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP