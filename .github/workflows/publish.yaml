name: Build and Publish Agent Images

# Images are ONLY built when a release tag for a specific agent is pushed.
# Tag format:  <agent>_v<major>.<minor>[.<patch>]
#   e.g.  translator_v1.0.0   orchestrator_v0.2.0   llm-agent_v1.1.0
#
#   git tag translator_v1.0.0 && git push origin translator_v1.0.0
#
# Only the agent named in the tag is built. Published image tags:
#   ghcr.io/<owner>/agentstack-starter/<agent>:<version>        (1.0.0)
#   ghcr.io/<owner>/agentstack-starter/<agent>:<major>.<minor>  (1.0)
#   ghcr.io/<owner>/agentstack-starter/<agent>:latest

on:
  push:
    tags:
      - '*_v*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agentstack-starter

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Parse release tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          AGENT="${TAG%_v*}"
          VERSION="${TAG##*_v}"
          AGENT="${AGENT//_/-}"   # accept llm_agent_v1.0.0 as alias of llm-agent_v1.0.0

          case "$AGENT" in
            llm-agent)    DOCKERFILE=docker/Dockerfile.llm-agent ;;
            translator)   DOCKERFILE=docker/Dockerfile.translator ;;
            orchestrator) DOCKERFILE=docker/Dockerfile.orchestrator ;;
            *)
              echo "::error::Unknown agent '$AGENT' in tag '$TAG' (expected llm-agent | translator | orchestrator)"
              exit 1 ;;
          esac

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Version '$VERSION' in tag '$TAG' is not <major>.<minor>[.<patch>]"
            exit 1
          fi

          # GHCR requires lowercase repository names; github.repository_owner
          # keeps the original casing (rxAlx), so normalize it here.
          IMAGE="${IMAGE_PREFIX,,}/${AGENT}"
          TAGS="${IMAGE}:${VERSION}"
          # 1.0.0 also gets a floating 1.0 tag; a plain 1.0 tag doesn't duplicate itself
          if [[ "$VERSION" == *.*.* ]]; then
            TAGS="${TAGS} ${IMAGE}:${VERSION%.*}"
          fi
          TAGS="${TAGS} ${IMAGE}:latest"

          {
            echo "agent=$AGENT"
            echo "dockerfile=$DOCKERFILE"
            echo "primary=${IMAGE}:${VERSION}"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Building $AGENT -> $TAGS"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Agent Stack CLI
        run: pip install agentstack-cli

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for multi-platform builds through the Agent Stack CLI:
      # the containerd image store keeps the full manifest list locally,
      # so we can retag and push every tag after a single build.
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: '{"features": {"containerd-snapshotter": true}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # client-side-build is local-only (no platform login needed). Unlike a
      # plain docker build, it runs the agent container to extract its agent
      # card and embeds it as an OCI label, which is what the Agent Stack
      # platform needs to recognize the image as an agent provider.
      - name: Build with Agent Stack CLI
        run: |
          agentstack client-side-build . \
            --dockerfile ${{ steps.parse.outputs.dockerfile }} \
            --tag "${{ steps.parse.outputs.primary }}" \
            --no-import \
            --multi-platform \
            --no-push

      - name: Push all tags
        run: |
          for tag in ${{ steps.parse.outputs.tags }}; do
            if [ "$tag" != "${{ steps.parse.outputs.primary }}" ]; then
              docker tag "${{ steps.parse.outputs.primary }}" "$tag"
            fi
            docker push "$tag"
          done
