name: Build and Publish Agent Images. Also automatically adds the agents to the Agent Stack registry.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agentstack-starter

jobs:
  build:
    name: Build ${{ matrix.agent }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: llm-agent
            dockerfile: docker/Dockerfile.llm-agent
          - agent: translator
            dockerfile: docker/Dockerfile.translator
          - agent: orchestrator
            dockerfile: docker/Dockerfile.orchestrator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Agent Stack CLI
        run: pip install agentstack-cli

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for multi-platform builds through the Agent Stack CLI:
      # the containerd image store keeps the full manifest list locally,
      # so we can retag and push every tag after a single build.
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: '{"features": {"containerd-snapshotter": true}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # agentstack client-side-build takes a single --tag, so we build once
      # with the first tag and retag/push the rest afterwards.
      - name: Pick primary tag
        id: primary_tag
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # client-side-build is local-only (no platform login needed). Unlike a
      # plain docker build, it runs the agent container to extract its agent
      # card and embeds it as an OCI label, which is what the Agent Stack
      # platform needs to recognize the image as an agent provider.
      - name: Build with Agent Stack CLI
        run: |
          agentstack client-side-build . \
            --dockerfile ${{ matrix.dockerfile }} \
            --tag "${{ steps.primary_tag.outputs.tag }}" \
            --no-import \
            --multi-platform \
            --no-push

      - name: Push all tags
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "${{ steps.primary_tag.outputs.tag }}" ]; then
              docker tag "${{ steps.primary_tag.outputs.tag }}" "$tag"
            fi
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
